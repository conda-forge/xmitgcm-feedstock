{% set name = "xmitgcm" %}
{% set version = "0.5.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 221b659f176c7e71228e597dd28b627bc4e86412b28b5009a3624a8a70bbe2cd

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - pytest-runner
  run:
    - python >={{ python_min }}
    - xarray >=0.11
    - dask >=1.0
    - numpy
    - cachetools
    - packaging
    - fsspec
    - zarr

test:
  imports:
    - xmitgcm
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mitgcm/xmitgcm
  license: MIT
  license_file: LICENSE
  summary: Read MITgcm mds binary files into xarray
  dev_url: https://github.com/mitgcm/xmitgcm
  doc_url: https://xmitgcm.readthedocs.io/

extra:
  recipe-maintainers:
    - raphaeldussin
    - ocefpaf
    - jbusecke
    - rabernat
    - timothyas
